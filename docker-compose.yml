services:
    app:
        container_name: app_estora_agency
        build:
            context: .
            dockerfile: ./_docker/Dockerfile
            args:
                USER: estora_agency
                UID: 1000
                PORT: 9000
                WORKDIR: /var/www

        volumes:
            - .:/var/www
            - ./storage:/var/www/storage
        ports:
            - "9000:9000"
        environment:
            - APP_ENV=local
            - APP_DEBUG=true
        depends_on:
            - postgres
        networks:
            - Estora-agency

    nginx:
        image: nginx:alpine
        container_name: nginx_estora_agency
        ports:
            - "80:80"
        volumes:
            - .:/var/www
            - ./_docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - app
        networks:
            - Estora-agency

    postgres:
        image: postgres:16
        container_name: postgres_estora_agency
        ports:
            - "5432:5432"
        environment:
            POSTGRES_DB: estora_agency
            POSTGRES_USER: laravel
            POSTGRES_PASSWORD: secret007
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - Estora-agency

    node:
        image: node:20-alpine
        container_name: node_estora_agency
        working_dir: /var/www
        volumes:
            - .:/var/www
        command: sh -c "npm install && npm run dev"
networks:
    Estora-agency:

volumes:
    postgres_data:
